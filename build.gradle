plugins {
    id 'java-library'
    id 'checkstyle'
    id 'pl.allegro.tech.build.axion-release' version '1.21.3'
    id 'maven-publish'
}

group = 'com.github.jruk8'

// Tag-based versions (v1.0.0), same convention as JManhunt and
// the validator: pushing a tag versions the jar and fires the
// release workflow. Untagged builds (CI, JitPack SHAs) resolve
// to a snapshot and still build.
scmVersion {
    repository {
        pushTagsOnly = true
    }
    tag {
        prefix = 'v'
        versionSeparator = ''
    }
}

project.version = scmVersion.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    // Paper API only for Bukkit types (events, Plugin, players).
    // compileOnly: the engine bundles the API, companions bring
    // their own Paper, and JitPack consumers get no transitive deps.
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")
    testImplementation("io.papermc.paper:paper-api:${paperApiVersion}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Paper 26.2 itself ships v69 bytecode, so the whole
    // ecosystem (servers, engine, companions) already
    // builds on 25: match it instead of downleveling.
    options.release = 25
}

test {
    useJUnitPlatform()
}

check {
    dependsOn 'checkstyleMain', 'checkstyleTest'
}

tasks.named('jar').configure {
    manifest {
        attributes(
                'Implementation-Title': 'JManhunt-API',
                'Implementation-Version': project.version
        )
    }
}

// Publishes the API for companion plugins. The coordinate matches
// the JitPack coordinate for this repository
// (com.github.jruk8:JManhunt-API:<tag>); locally, run
// `./gradlew publishToMavenLocal` and add `mavenLocal()` to the
// consumer. The plain jar is the artifact: JitPack builds it via
// publishToMavenLocal, the engine composites the same output,
// and the release workflow uploads it to GitHub releases.
publishing {
    publications {
        api(MavenPublication) {
            groupId = 'com.github.jruk8'
            artifactId = 'JManhunt-API'
            from components.java
        }
    }
}
